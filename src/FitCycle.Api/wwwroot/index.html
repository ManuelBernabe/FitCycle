<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#512BD4">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <!-- Preconnect to image hosts so exercise thumbnails load faster -->
  <link rel="preconnect" href="https://wger.de" crossorigin>
  <link rel="dns-prefetch" href="https://wger.de">
  <link rel="preconnect" href="https://www.youtube.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.youtube.com">
  <title>FitCycle</title>
  <link rel="stylesheet" href="/css/app.css?v=107">
  <script>
    // Apply theme before first paint to prevent flash
    (function(){var t=localStorage.getItem('fitcycle_theme')||'auto';if(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');})();
  </script>
</head>
<body>
  <div id="app">
    <div id="app-loading" style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;">
      <div style="font-size:32px;font-weight:bold;color:#512BD4;">FC</div>
      <div id="app-status" style="margin-top:8px;color:#999;">Cargando...</div>
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
      // When the SW activates a new version, hot-reload the page so the user gets the
      // new app shell (including bug fixes to workout.js etc.) without having to close
      // and reopen the PWA. Guarded by sessionStorage so we only reload ONCE per session.
      navigator.serviceWorker.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'sw-activated' && !sessionStorage.getItem('fc_sw_reloaded')) {
          sessionStorage.setItem('fc_sw_reloaded', '1');
          location.reload();
        }
      });
      // Poll for SW updates every 60s so a long-running PWA picks up new versions sooner.
      // Without this, iOS PWAs can stay on a stale SW for days.
      setInterval(() => {
        navigator.serviceWorker.getRegistration().then(reg => reg && reg.update().catch(() => {}));
      }, 60 * 1000);
    }
  </script>
  <script src="/js/qrcode.min.js"></script>
  <script type="module" src="/js/app.js?v=107"></script>
</body>
</html>
